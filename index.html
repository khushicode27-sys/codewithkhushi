<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>
      Online Coding Classes for Kids in India | CodeWithKhushi
    </title>

    <meta
      name="description"
      content="CodeWithKhushi offers live online coding classes for kids and school students in India. Learn Coding, Python, C++, Scratch, Robotics and Web Development through practical projects."
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <link
      rel="canonical"
      href="https://www.codewithkhushi.in/"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <!-- Open Graph / Social Sharing -->
    <meta
      property="og:title"
      content="Online Coding Classes for Kids in India | CodeWithKhushi"
    />

    <meta
      property="og:description"
      content="Learn Coding, Python, C++, Scratch, Robotics and Web Development with CodeWithKhushi through live and practical classes."
    />

    <meta
      property="og:url"
      content="https://www.codewithkhushi.in/"
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="CodeWithKhushi"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Online Coding Classes for Kids in India | CodeWithKhushi"
    />

    <meta
      name="twitter:description"
      content="Live coding, Python, Scratch, Robotics and Web Development classes for kids and school students."
    />

    <!-- Website Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "CodeWithKhushi",
        "url": "https://www.codewithkhushi.in/",
        "description": "Online coding classes for kids and school students in India.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://www.codewithkhushi.in/?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
